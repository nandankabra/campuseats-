<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CampusEats Menu</h1>
  <p class="sub">Dishes served by GraphQL and stored in MySQL</p>
  <div id="list" aria-live="polite">Loading&hellip;</div>

  <form id="addForm">
    <h2>Add a dish</h2>
    <div class="form-row">
      <label for="name">Dish name
        <input id="name" name="name" placeholder="Dish name" maxlength="100" required>
      </label>
      <label for="price">Price (INR)
        <input id="price" name="price" type="number" placeholder="Price" min="0" max="99999999.99" step="0.01" required>
      </label>
      <label class="availability" for="available">
        <input id="available" name="available" type="checkbox" checked> Available
      </label>
      <button type="submit">Add dish</button>
    </div>
    <p id="status" role="status"></p>
  </form>

  <script>
    const API = 'http://localhost:4007/';
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const form = document.getElementById('addForm');

    async function gql(query, variables) {
      const response = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables }),
      });
      const result = await response.json();
      if (!response.ok || result.errors) {
        throw new Error(result.errors?.map(error => error.message).join('; ') || 'Request failed.');
      }
      return result.data;
    }

    async function load() {
      const data = await gql('{ dishes { id name price available } }');
      list.replaceChildren();
      for (const dish of data.dishes) {
        const card = document.createElement('div');
        card.className = 'dish-card';
        const heading = document.createElement('h2');
        heading.textContent = dish.name;
        const price = document.createElement('p');
        price.className = 'price';
        price.textContent = new Intl.NumberFormat('en-IN', {
          style: 'currency', currency: 'INR',
        }).format(dish.price);
        const availability = document.createElement('p');
        availability.className = 'dish-availability';
        availability.textContent = dish.available ? 'Available' : 'Unavailable';
        card.append(heading, price, availability);
        list.append(card);
      }
      if (!data.dishes.length) list.textContent = 'No dishes yet.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      const input = {
        name: document.getElementById('name').value,
        price: Number(document.getElementById('price').value),
        available: document.getElementById('available').checked,
      };
      button.disabled = true;
      status.textContent = 'Saving...';
      try {
        const data = await gql(
          'mutation($input: AddDishInput!) { addDish(input: $input) { id name price available } }',
          { input }
        );
        form.reset();
        // The INSERT succeeded; a failed refresh must not suggest retrying it.
        status.textContent = `Added ${data.addDish.name}.`;
        try {
          await load();
        } catch (error) {
          status.textContent += ` Refresh the page to reload the menu: ${error.message}`;
        }
      } catch (error) {
        status.textContent = `Could not add dish: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    load().catch(error => {
      list.textContent = `Could not load the menu. Check the API at ${API} (${error.message})`;
    });
  </script>
</body>
</html>
