<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Campus Library</h1>
  <p class="sub">Authors and their books &mdash; data served by GraphQL</p>

  <div id="list">Loading&hellip;</div>

  <form id="addForm">
    <h3>Add a book</h3>
    <div class="form-row">
      <input id="title" placeholder="Book title" required>
      <input id="year" type="number" placeholder="Year">
      <select id="authorId">
        <option value="1">Asha Patel</option>
        <option value="2">Ravi Kumar</option>
      </select>
      <button type="submit" class="btn-primary">Add book</button>
    </div>
  </form>

  <script>
    const API = 'http://localhost:4000/';

    // helper: send a GraphQL query/mutation to the API
    async function gql(query, variables) {
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables }),
        });
        const json = await res.json();
        if (json.errors) {
          console.error('GraphQL errors:', json.errors);
          alert('Error: ' + json.errors.map(e => e.message).join('\n'));
        }
        return json.data;
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('list').innerHTML = `
          <div style="background:#feece7; color:#e8541e; padding:1rem; border-radius:8px; border:1px solid #f9c7b8;">
            <strong>Unable to connect to GraphQL API at ${API}</strong><br>
            Please make sure <code>node server.js</code> is running on port 4000.
          </div>
        `;
        return null;
      }
    }

    // 1. READ: load all authors with their books
    async function load() {
      const data = await gql(`{ authors { id name country books { id title year } } }`);
      if (!data || !data.authors) return;

      // Update author select options dynamically
      const authorSelect = document.getElementById('authorId');
      if (data.authors.length > 0) {
        authorSelect.innerHTML = data.authors.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      }

      // Render author cards
      document.getElementById('list').innerHTML = data.authors.map(a => `
        <div class="author-card">
          <h2>${a.name}</h2>
          <div class="country">${a.country || ''}</div>
          ${a.books && a.books.length > 0
            ? a.books.map(b => `
                <div class="book">
                  <span>${b.title} <span class="yr">(${b.year || 'N/A'})</span></span>
                  <button class="del-btn" title="Delete book" onclick="deleteBookItem('${b.id}')">&times;</button>
                </div>
              `).join('')
            : '<div style="color:#888; font-size:0.88rem; font-style:italic;">No books listed</div>'
          }
        </div>
      `).join('');
    }

    // 2. WRITE: add a book, then reload the list
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const yearVal = document.getElementById('year').value;
      const year = yearVal ? Number(yearVal) : null;
      const authorId = document.getElementById('authorId').value;

      if (!title || !authorId) return;

      const data = await gql(
        `mutation($t:String!,$y:Int,$a:ID!){ addBook(title:$t, year:$y, authorId:$a){ id } }`,
        { t: title, y: year, a: authorId }
      );

      if (data && data.addBook) {
        e.target.reset();
        load();
      }
    });

    // Optional: Delete book
    async function deleteBookItem(id) {
      if (!confirm('Are you sure you want to remove this book?')) return;
      const data = await gql(`mutation($id: ID!) { deleteBook(id: $id) }`, { id });
      if (data && data.deleteBook) {
        load();
      }
    }

    load();
  </script>
</body>
</html>
